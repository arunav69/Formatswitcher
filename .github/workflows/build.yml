name: Build APK on: push: workflow_dispatch: jobs: build: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - name: Unzip project if needed run: | if [ ! -f "FormatSwitcher/settings.gradle.kts" ] && [ -f "FormatSwitcher.zip" ]; then unzip -o FormatSwitcher.zip fi - name: Set up JDK 17 uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' - name: Set up Gradle uses: gradle/actions/setup-gradle@v4 with: gradle-version: '8.7' - name: Build debug APK working-directory: FormatSwitcher run: gradle assembleDebug --no-daemon - name: Upload APK uses: actions/upload-artifact@v4 with: name: app-debug-apk path: FormatSwitcher/app/build/outputs/apk/debug/app-debug.apk
