name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip project if needed
        run: |
          if [ ! -f "FormatSwitcher/settings.gradle.kts" ] && [ -f "FormatSwitcher.zip" ]; then
            unzip -o FormatSwitcher.zip
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: FormatSwitcher
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: FormatSwitcher
        run: ./gradlew assembleDebug --no-daemon --warning-mode=none

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: FormatSwitcher/app/build/outputs/apk/debug/app-debug.apk
          
